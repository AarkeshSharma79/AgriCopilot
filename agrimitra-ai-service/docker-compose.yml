version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: agrimitra-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: agrimitra-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/agrimitra
      - AI_SERVICE_URL=http://ai-service:6000
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
      - ai-service
    volumes:
      - backend-uploads:/app/uploads

  ai-service:
    build:
      context: ./ai-service
    container_name: agrimitra-ai-service
    restart: unless-stopped
    ports:
      - "6000:6000"
    env_file:
      - ./ai-service/.env

volumes:
  mongo-data:
  backend-uploads:
